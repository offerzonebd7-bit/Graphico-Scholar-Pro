
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Graphico Scholar - Academic AI Mentor</title>
  <script>
    // Critical Fix: Define process before any module loads to prevent white screen
    window.process = { env: { API_KEY: "" } };
    
    // Safety check to show errors on screen if the app fails to load
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.background = 'red';
      errorDiv.style.color = 'white';
      errorDiv.style.padding = '10px';
      errorDiv.style.fontSize = '12px';
      errorDiv.style.zIndex = '9999';
      errorDiv.innerText = 'Error: ' + msg + ' (Line: ' + lineNo + ')';
      document.body.appendChild(errorDiv);
      return false;
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-height: 100%;
    }
    body {
      font-family: 'Noto Sans Bengali', sans-serif;
      background-color: #fcfaf2;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .arabic {
      font-family: 'Amiri', serif;
      direction: rtl;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c2b280;
      border-radius: 10px;
    }
    /* Android keyboard fix */
    .mobile-chat-container {
      height: calc(100dvh - 64px); /* Subtracting header approx height */
    }
  </style>
